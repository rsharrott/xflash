  <h2 id="browse">閲覧モード</h2>
  <p><strong>練習モード</strong>で自分をテストする代わりに、<strong>閲覧モード</strong>ではカードと意味をまとめて見直せます。<strong>設定</strong>をタップし、<strong>学習モード</strong>で2つのモードを切り替えます。</p>
  <p>閲覧モードでは、<strong>前へ</strong>・<strong>次へ</strong>ボタンでセットの中を前後に移動できます。<strong>アクション</strong>ボタンで、カードを学習セットに追加したり、シェアしたり、<strong>誤りを報告</strong>で誤りを知らせたりできます。</p>
