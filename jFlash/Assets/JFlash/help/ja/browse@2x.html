  <p><strong class="nw">練習モード</strong>で自分をテストする代わりに、<strong class="nw">閲覧モード</strong>ではカードと意味をまとめて見直せます。<strong class="nw">設定</strong>をタップし、<strong class="nw">学習モード</strong>で2つのモードを切り替えます。</p>
