  <h2>複数のユーザー</h2>
  <p>iPhoneやiPadを人に<em>貸した</em>ことはありませんか？ ほとんどのアプリでは、その人の学習データがあなたのデータと混ざってしまいます。Japanese in a Flash!ではユーザーを何人でも追加でき、ユーザーごとに学習データを分けておけます。</p>
  <figure class="phone"><img src="../img/share-users-ja.png" alt="使用中のユーザー（あなた）が強調表示されたユーザーの選択画面"></figure>
  <p><strong>設定</strong>タブで<strong>使用中のユーザー</strong>をタップすると、<strong>ユーザーを選択</strong>が開きます。名前をタップして確認すると、その人が使用中のユーザーになります。</p>
  <p>新しいユーザーは<strong>＋</strong>ボタンで追加できます。最初からいくつかユーザーを用意してあります！</p>
