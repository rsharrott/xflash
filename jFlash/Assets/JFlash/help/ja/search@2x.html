<!DOCTYPE html>
<html lang="ja">
<head>

<title>検索</title>
<link href="../help.css" rel="stylesheet">
</head>
<body>
<main>
  <!-- DRAFT Japanese translation of ../search@2x.html. UI terms are the app's own ja strings. Needs a native review before it ships. -->
  <h2>検索</h2>
  <p>200,000語以上のJapanese in a Flash!の辞書を、<strong class="nw">英語</strong>、<strong class="nw">ローマ字</strong>、<strong class="nw">ひらがな</strong>、<strong class="nw">漢字</strong>で1秒以内に検索できます。</p>
  <figure class="phone"><img src="../img/search-results-ja.png" alt="英単語の検索結果。1件の結果のスターが付いている"></figure>
  <p>左側のスターが見えますか？ 1回タップすると、その単語がすぐに<strong>My Starred Words</strong>セットに追加されます！</p>
  <p>検索は、<strong class="nw">単語全体</strong>で探し、動詞は辞書形で入力するといちばんうまくいきます。どちらの言語でも、複数の語をまとめて検索できます。</p>
  <p>単語の最後に<strong class="nw">?</strong>を付けてみてください。たとえば<strong class="nw">japan?</strong>で検索すると、<strong class="nw">Japan</strong>、<strong>Japanese</strong>、<strong>Japanofile</strong>、<strong>Japanasaurus Rex</strong>などが見つかります。</p>
</main>
</body>
</html>
