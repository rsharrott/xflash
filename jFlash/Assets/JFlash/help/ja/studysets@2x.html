<main>
  <!-- DRAFT Japanese translation of ../studysets@2x.html. UI terms are the app's own ja strings. Needs a native review before it ships. -->
  <h2>セットを選ぶ</h2>
  <p><strong>セット</strong>タブをタップして、セットを選びます。セットはフォルダに分かれていて、<strong>検索</strong>もできます。</p>

  <figure class="phone"><img src="../img/studysets-list-ja.png" alt="学習セットのタブと、上のバーの＋ボタン"></figure>

  <p>検索するには、画面を下にスワイプして検索バーを表示します。セット名の一部を入力すると、すぐに結果が表示されます。</p>

  <h2>セットを作る</h2>
  <p><strong>セット</strong>タブをタップし、右上の<strong>＋</strong>をタップすると、新しいセットを追加できます。</p>
  <p>新しいセットに単語を追加するには、<strong>検索</strong>を使うか、ほかのセットのカードから<strong>アクション</strong>ボタンで追加します。</p>
</main>
