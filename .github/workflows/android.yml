name: Android

# Build, lint, and unit-test the Compose app. This workflow does not run the
# iOS checks in unit-tests.yml, and it does not change that file.
on:
  pull_request:
    paths:
      - 'android-app/**'
      - 'jFlash/sql/jFlash.db'
      - 'jFlash/sql/jFlash-CARD-2.0.db'
      - 'jFlash/sql/plugins/jFlash-FTS-2.0.db'
      - 'jFlash/sql/plugins/jFlash-EX-2.0.db'
      - '.github/workflows/android.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: assemble, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up JDK 21
        # v6.1.0
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        # v4.0.4
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Ensure sqlite3
        run: command -v sqlite3 >/dev/null || (sudo apt-get update && sudo apt-get install -y sqlite3)

      - name: Set up Gradle
        # v6.4.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Assemble, lint, and test
        working-directory: android-app
        run: ./gradlew assembleDebug lint test --stacktrace

      - name: Upload debug APK
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: japanese-in-a-flash-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
